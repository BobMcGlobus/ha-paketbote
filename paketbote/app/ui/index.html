<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paketbote</title>
<style>
  :root {
    /* Off-white like letter paper, accent the brown-orange of a parcel. */
    --bg: #faf7f1; --card: #fffdfa; --line: #e8e0d4; --text: #241d16; --muted: #7c7268;
    --accent: #d0752c; --accent-ink: #a4571a; --ok: #2f8f5b; --ok-soft: #e6f2ea;
    --warn: #c07a12; --warn-soft: #fbf0dc; --bad: #c34141; --bad-soft: #fbeae8;
    --chip: #f1eade; --hero-a: #e4903f; --hero-b: #b45f1c;
    --shadow: 0 1px 2px rgba(60,42,24,.05), 0 10px 26px -14px rgba(60,42,24,.3);
    --nav: rgba(255,253,250,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f; --card: #1f1b16; --line: #322b23; --text: #f0eae2; --muted: #a2968a;
      --accent: #e79240; --accent-ink: #f0a95f; --ok: #4cbd80; --ok-soft: #17301f;
      --warn: #e0a752; --warn-soft: #33260f; --bad: #ef7373; --bad-soft: #351b1a;
      --chip: #2a241d; --hero-a: #c0752c; --hero-b: #7d4213;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.8);
      --nav: rgba(22,19,15,.9);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(4.6rem + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 56rem; margin: 0 auto; padding: 1rem 1rem 0; }
  h2 { font-size: 1.05rem; margin: 1.6rem 0 .7rem; font-weight: 650; letter-spacing: -.01em; }
  h2:first-child { margin-top: .25rem; }
  .muted { color: var(--muted); }

  /* key visual */
  .hero {
    border-radius: 1.1rem; padding: 1.1rem 1.25rem; margin-bottom: 1rem; color: #fff;
    background: linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 100%);
    display: flex; align-items: center; gap: 1rem; box-shadow: var(--shadow);
  }
  .hero .txt { flex: 1; min-width: 0; }
  .hero .eyebrow { font-size: .78rem; opacity: .8; letter-spacing: .06em; text-transform: uppercase; }
  .hero .big { font-size: 1.5rem; font-weight: 680; letter-spacing: -.02em; line-height: 1.25; }
  .hero .sub { font-size: .88rem; opacity: .85; }
  .hero svg { flex: none; opacity: .95; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: .55rem; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: .85rem; padding: .7rem .85rem; }
  .stat .v { font-size: 1.4rem; font-weight: 660; letter-spacing: -.02em; }
  .stat .k { color: var(--muted); font-size: .78rem; }

  .alert { border-radius: .85rem; padding: .8rem 1rem; margin-bottom: .6rem;
           display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; border: 1px solid transparent; }
  .alert.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .alert strong { font-weight: 650; }

  button, .btn, select, input {
    font: inherit; border: 1px solid var(--line); border-radius: .65rem;
    padding: .5rem .8rem; background: var(--card); color: var(--text);
  }
  button, .btn { font-weight: 560; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: 0; background: none; color: var(--muted); padding: .1rem 0;
                font-weight: 500; font-size: .85rem; text-decoration: underline; }

  /* shipment card with status ring */
  .ship { background: var(--card); border: 1px solid var(--line); border-radius: .95rem;
          padding: .85rem; margin-bottom: .6rem; display: flex; gap: .85rem; box-shadow: var(--shadow); }
  .ring { position: relative; width: 3rem; height: 3rem; flex: none; }
  /* Only the progress arc is rotated. Catching the glyph too turns a tick
     into a chevron and a truck into a padlock. */
  .ring > svg { transform: rotate(-90deg); display: block; }
  .ring .glyph { position: absolute; inset: 0; display: grid; place-items: center; }
  .body { flex: 1; min-width: 0; }
  .body .when { font-size: 1.12rem; font-weight: 680; letter-spacing: -.015em; line-height: 1.25; }
  .body .when .clock { font-weight: 560; opacity: .85; }
  .body .title { font-weight: 520; line-height: 1.35; overflow-wrap: anywhere;
                 color: var(--muted); margin-top: .05rem; }
  .items { margin-top: .5rem; display: flex; flex-direction: column; gap: .4rem; }
  .item { display: flex; gap: .55rem; align-items: center; }
  .item-blank { width: 2.1rem; height: 2.1rem; border-radius: .35rem; background: var(--chip); flex: none; }
  .item img { width: 2.1rem; height: 2.1rem; border-radius: .35rem; object-fit: cover;
              background: var(--chip); flex: none; }
  .item .name { font-size: .88rem; line-height: 1.3; overflow-wrap: anywhere; }
  .ship { position: relative; }
  .carrierMark { position: absolute; top: .7rem; right: .7rem; font-size: .66rem;
                 font-weight: 800; letter-spacing: .04em; padding: .12rem .4rem;
                 border-radius: .3rem; color: #fff; }
  .body .meta { color: var(--muted); font-size: .84rem; margin-top: .3rem;
                display: flex; gap: .3rem .8rem; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .chip { font-size: .82rem; font-weight: 560; padding: .3rem .7rem; border-radius: 999px;
          border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .chip.off { opacity: .45; text-decoration: line-through; }
  .badge { font-size: .76rem; font-weight: 600; padding: .1rem .45rem; border-radius: .38rem;
           background: var(--chip); color: var(--text); white-space: nowrap; }
  a { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 2.5rem 1rem; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: .95rem;
           padding: .9rem 1rem; margin-bottom: .6rem; box-shadow: var(--shadow); }
  .row { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .k { color: var(--muted); }
  .grid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); align-items: end; }
  .field { display: flex; flex-direction: column; gap: .25rem; }
  .field label { font-size: .78rem; color: var(--muted); }
  .field input, .field select { width: 100%; }
  .field.switch { flex-direction: row; align-items: center; justify-content: space-between; gap: .75rem; }
  .field.switch label { font-size: .9rem; color: var(--text); }
  .field.switch input { width: 1.2rem; height: 1.2rem; flex: none; accent-color: var(--accent); }
  .msg { grid-column: 1/-1; font-size: .85rem; color: var(--bad); }
  details.add summary { cursor: pointer; font-weight: 620; padding: .15rem 0 .5rem; }

  /* navigation */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--nav); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around;
  }
  nav a { display: flex; flex-direction: column; align-items: center; gap: .1rem;
          font-size: .68rem; font-weight: 560; color: var(--muted); text-decoration: none;
          padding: .35rem .6rem; border-radius: .6rem; min-width: 4rem; }
  nav a.on { color: var(--accent); }
  nav .pill { position: absolute; top: .15rem; right: .55rem; background: var(--accent); color: #fff;
              font-size: .6rem; border-radius: 1rem; padding: 0 .28rem; }
  nav a { position: relative; }
  @media (min-width: 44rem) {
    body { padding-bottom: 2rem; }
    nav { position: sticky; top: 0; bottom: auto; justify-content: center; gap: .25rem;
          border-top: 0; border-bottom: 1px solid var(--line); padding: .4rem; }
    nav a { flex-direction: row; gap: .45rem; font-size: .9rem; padding: .45rem .85rem; }
  }
  [data-page] { display: none; }
  [data-page].on { display: block; }
</style>
</head>

    </div>
    <div id="alerts"></div>

    <h2 id="hParcels"></h2>
    <div class="chips" id="filter"></div>

        <div class="field"><label for="recipient"></label><input id="recipient" list="knownPeople" autocomplete="off"><datalist id="knownPeople"></datalist></div>
        <div class="field"><label>&nbsp;</label><button class="primary" id="addBtn"></button></div>
        <div class="msg" id="addMsg"></div>
      </div>
    </div>
    <p class="muted" id="addHint"></p>
  </section>

  <section data-page="settings">
    <h2 id="hOptions"></h2>
    <div id="options"></div>
    <div class="panel">
      <button class="primary" id="saveSettings"></button>
      <span id="carrierTests"></span>
      <button id="resetSettings"></button>
      <span class="muted" id="saveMsg"></span>
    </div>

    <h2 id="hStatus"></h2>
    <div class="panel" id="diag"></div>
    <h2 id="hSelectors"></h2>
    <div class="panel" id="selectors"></div>
    <h2 id="hActions"></h2>
    <div class="panel">
      <p class="muted" id="settingsHint"></p>
      <button id="poll"></button>
      <a class="btn" id="browserLink" href="browser/" target="_blank" rel="noopener"></a>
    </div>
  </section>
</div>

  settings: '<path d="M4 21v-6M4 11V3M12 21v-9M12 8V3M20 21v-4M20 13V3"/><path d="M1.5 15h5M9.5 8h5M17.5 17h5"/>',
};
const icon = (name, size = 22, stroke = 1.7) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;

const PROGRESS = { ordered: .25, shipped: .5, out_for_delivery: .8, delivered: 1, exception: .5, unknown: .12 };
const GLYPH = { ordered: "box", shipped: "truck", out_for_delivery: "truck", delivered: "check", exception: "alert", unknown: "box" };
const URGENT = new Set(["IMMINENT", "APPROACHING"]);

// Drawn here rather than shipping the carriers' logo files: brand colours and
// a wordmark say the same thing without copying anyone's artwork.
const CARRIER_MARK = {
  DHL: { bg: "#d40511", fg: "#ffcc00", text: "DHL" },
  AMZL: { bg: "#232f3e", fg: "#ff9900", text: "AMZN" },
  DPD: { bg: "#dc0032", fg: "#ffffff", text: "DPD" },
  Hermes: { bg: "#0091d2", fg: "#ffffff", text: "HERMES" },
  GLS: { bg: "#06316d", fg: "#ffd200", text: "GLS" },
  UPS: { bg: "#351c15", fg: "#ffb500", text: "UPS" },
  FedEx: { bg: "#4d148c", fg: "#ff6600", text: "FEDEX" },
  "Deutsche Post": { bg: "#ffcc00", fg: "#d40511", text: "POST" },
};
const carrierMark = (carrier) => {
  const mark = CARRIER_MARK[carrier];
  if (!mark) return "";
  return `<span class="carrierMark" style="background:${mark.bg};color:${mark.fg}">${esc(mark.text)}</span>`;
};

let L = T.de;
let page = "parcels";
let carriersLoaded = false;
let editing = null;
let latest = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const $ = (id) => document.getElementById(id);

const fmtDate = (iso) => {
  if (!iso) return null;
  const d = new Date(iso.length > 10 ? iso : iso + "T00:00:00");
  if (Number.isNaN(d.getTime())) return iso;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 86400000);
  if (days === 0) return L.today0;
  if (days === 1) return L.tomorrow;
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
};
const fmtAgo = (iso) => {
  if (!iso) return L.never;
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (!Number.isFinite(mins)) return L.never;
  if (mins < 1) return L.justNow;
  if (mins < 60) return L.minsAgo(mins);
  const h = Math.round(mins / 60);
  return h < 24 ? L.hoursAgo(h) : L.daysAgo(Math.round(h / 24));
};

function ring(shipment) {
  const pct = PROGRESS[shipment.status] ?? .12;
  const colour = shipment.status === "delivered" ? "var(--ok)"
    : shipment.status === "exception" ? "var(--bad)"
    : URGENT.has(shipment.state) ? "var(--warn)" : "var(--accent)";
  const r = 20, c = 2 * Math.PI * r;
  return `<div class="ring">
    <svg width="48" height="48" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
      <circle cx="24" cy="24" r="${r}" fill="none" stroke="${colour}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/>
    </svg>
    <span class="glyph" style="color:${colour}">${icon(GLYPH[shipment.status] || "box", 20)}</span>
  </div>`;
}

function shipCard(s, { editable = false, delivered = false } = {}) {
  const colour = s.status === "delivered" ? "var(--ok)"
    : s.status === "exception" ? "var(--bad)"
    : URGENT.has(s.state) ? "var(--warn)" : "var(--accent)";
  const bits = [];
  if (!delivered && s.status) bits.push(`<span>${esc(L.statuses[s.status] || s.status)}</span>`);
  if (s.carrier) bits.push(`<span>${esc(s.carrier)}</span>`);
  if (s.recipient) bits.push(`<span class="badge">${esc(s.recipient)}</span>`);
  if (s.source === "manual") bits.push(`<span class="badge">${esc(L.manual)}</span>`);
  if (s.tracking_url) bits.push(`<a href="${esc(s.tracking_url)}" target="_blank" rel="noopener">${esc(s.source === "manual" ? L.track : L.openAmazon)}</a>`);
  if (delivered) bits.push(`<button class="link" data-restore="${esc(s.shipment_id)}">${esc(L.restore)}</button>`);
  if (editable && s.source === "manual") {
    bits.push(`<button class="link" data-edit="${esc(s.shipment_id)}">${esc(L.edit)}</button>`);
    bits.push(`<button class="link" data-remove="${esc(s.shipment_id)}">${esc(L.remove)}</button>`);
  }

  if (editing === s.shipment_id) {
    return el(`<div class="ship">${ring(s)}<div class="body">
      <div class="grid">
        <div class="field"><label>${esc(L.title)}</label><input id="editTitle" value="${esc(s.title)}"></div>
        <div class="field"><label>${esc(L.recipient)}</label><input id="editRecipient" value="${esc(s.recipient)}"></div>
        <div class="field"><label>&nbsp;</label><button class="primary" data-save="${esc(s.shipment_id)}">${esc(L.save)}</button></div>
        <div class="field"><label>&nbsp;</label><button data-cancel="1">${esc(L.cancel)}</button></div>
      </div></div></div>`);
  }

  const urgent = URGENT.has(s.state) || s.state === "WINDOW";
  const items = (s.items || []).length
    ? `<div class="items">${s.items.map((i) => `<div class="item">
        ${i.image ? `<img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
                  : `<span class="item-blank"></span>`}
        <span class="name">${esc(i.title)}</span></div>`).join("")}</div>`
    : `<div class="title">${esc(s.title || s.shipment_id)}</div>`;

  return el(`<div class="ship">${carrierMark(s.carrier)}${ring(s)}<div class="body">
    <div class="when" style="color:${urgent ? colour : "inherit"}">${headline(s, delivered)}</div>
    ${items}
    <div class="meta"><span class="badge">${esc(L.states[s.state] || s.state)}</span>${bits.join("")}</div>
    </div></div>`);
}

function headline(s, delivered) {
  if (delivered) return esc(L.deliveredOn(fmtDate(s.delivered_at)));
  const day = fmtDate(s.expected_date);
  const window = s.window_start
    ? `<span class="clock">${esc(s.window_start.slice(0, 5))}–${esc((s.window_end || "").slice(0, 5))}</span>` : "";
  if (s.stops_remaining !== null && s.stops_remaining !== undefined && s.stops_remaining <= 9) {
    return `${esc(L.stopsLeft(s.stops_remaining))} ${window}`;
  }
  if (!day) return esc(L.statuses[s.status] || s.status);
  return `${esc(day.charAt(0).toUpperCase() + day.slice(1))} ${window}`;
}

function renderNav(counts) {
  const items = [
    ["parcels", counts.active], ["archive", 0], ["add", 0], ["settings", 0],
  ];
  $("nav").innerHTML = items.map(([key, n]) =>
    `<a href="#" data-nav="${key}" class="${page === key ? "on" : ""}">${icon(key, 21)}
      <span>${esc(L.nav[key])}</span>${n ? `<span class="pill">${n}</span>` : ""}</a>`).join("");
}

function renderFilter(data) {
  const box = $("filter");
  const people = data.recipients || [];
  if (people.length < 2) { box.innerHTML = ""; return; }
  const hidden = new Set(data.hidden_recipients || []);
  box.innerHTML = people.map((r) =>
    `<button class="chip ${hidden.has(r.key) ? "off" : ""}" data-filter="${esc(r.key)}"
      title="${esc(L.filterHint)}">${esc(r.display)}</button>`).join("");
}

function renderParcels(data) {
  const hidden = new Set(data.hidden_recipients || []);
  const current = data.shipments.filter(
    (s) => s.bucket === "current" && !hidden.has(s.recipient_key));
  const today = data.status?.pakete_heute ?? 0;
  $("heroBig").textContent = current.length === 0 ? L.heroNone
    : current.length === 1 ? L.heroOne : L.heroMany(current.length);
  $("heroSub").textContent = current.length === 0 ? L.heroSubNone : L.heroSubToday(today);

  const st = data.status || {};
  $("stats").innerHTML = [
    [L.active, current.length], [L.today, st.pakete_heute ?? "–"],
    [L.stops, st.naechste_stopps ?? "–"], [L.lastPoll, fmtAgo(st.letzter_abruf)],
  ].map(([k, v]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("");

  renderFilter(data);
  const box = $("ships"); box.innerHTML = "";
  if (!current.length) box.innerHTML = `<div class="empty">${esc(L.empty)}</div>`;
  else current.forEach((s) => box.append(shipCard(s, { editable: true })));

  const alerts = $("alerts"); alerts.innerHTML = "";
  if (st.login_erforderlich) alerts.append(el(`<div class="alert bad"><strong>${esc(L.loginTitle)}</strong>
    <span>${esc(L.loginBody)}</span><span style="flex:1"></span>
    <a class="btn" href="browser/" target="_blank" rel="noopener">${esc(L.browser)}</a></div>`));
  if (st.gedrosselt) alerts.append(el(`<div class="alert warn"><strong>${esc(L.throttledTitle)}</strong><span>${esc(L.throttledBody)}</span></div>`));
  if (st.selektoren_defekt) alerts.append(el(`<div class="alert warn"><strong>${esc(L.selectorsTitle)}</strong><span>${esc(L.selectorsBody)}</span></div>`));
}

function renderArchive(data) {
  for (const [bucket, node, emptyText] of [
    ["delivered", $("delivered"), L.deliveredEmpty], ["archive", $("archive"), L.archiveEmpty],
  ]) {
    const list = data.shipments.filter((s) => s.bucket === bucket);
    node.innerHTML = "";
    if (!list.length) node.innerHTML = `<div class="empty">${esc(emptyText)}</div>`;
    else list.forEach((s) => node.append(shipCard(s, { delivered: true })));
  }
}

function renderSettings(data) {
  const b = data.budget, f = data.features;
  const rows = [
    [L.version, data.version],
    [L.lastPoll, fmtAgo(data.status?.letzter_abruf)],
    [L.amazonCalls, `${b.amazon_used} / ${b.amazon_cap}`],
    [L.llm, f.llm ? L.on : L.off],
  ];
  const tiers = data.carrier_tier || {};
  for (const [key, name] of TESTABLE) {
    const used = b.carrier_used?.[key] ?? 0;
    const tier = tiers[key];
    rows.splice(rows.length - 1, 0,
      [name, tier ? `${tier === "web" ? L.viaWeb : L.viaApi} · ${used}` : L.off]);
  }
  const eff = data.status?.effective;
  if (eff) {
    rows.push([L.inEffect,
      `${L.dhl}: ${eff.dhl ? L.on : L.off} · ${L.amazonCalls.split(" ")[0]} ${eff.daily_request_cap} · ${eff.poll_idle_minutes} min`]);
  }
  $("diag").innerHTML = rows.map(([k, v]) =>
    `<div class="row"><span class="k">${esc(k)}</span><span>${esc(v)}</span></div>`).join("");

  const fields = Object.entries(data.selectors || {});
  $("selectors").innerHTML = fields.length
    ? fields.map(([name, h]) => `<div class="row"><span class="k">${esc(name)}</span>
        <span>${h.rate === null ? "–" : Math.round(h.rate * 100) + " %"}</span></div>`).join("")
    : `<div class="muted">${esc(L.noneYet)}</div>`;
}

let settingsCache = null;

function renderOptions(payload) {
  settingsCache = payload;
  const byGroup = {};
  for (const f of payload.schema) (byGroup[f.group] ||= []).push(f);

  $("options").innerHTML = payload.groups.filter((g) => byGroup[g]).map((group) => {
    const rows = byGroup[group].map((f) => {
      const value = payload.values[f.key];
      const label = `${esc(L.labels[f.key] || f.key)}${f.unit ? ` (${esc(f.unit)})` : ""}`
        + (f.restart ? ` <span class="muted">· ${esc(L.needsRestart)}</span>` : "");
      let input;
      if (f.kind === "bool") {
        input = `<input type="checkbox" data-key="${esc(f.key)}" ${value ? "checked" : ""}>`;
      } else if (f.kind === "select") {
        input = `<select data-key="${esc(f.key)}">${f.options.map((o) =>
          `<option ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      } else if (f.kind === "int") {
        input = `<input type="number" data-key="${esc(f.key)}" value="${esc(value)}"
          min="${f.min ?? ""}" max="${f.max ?? ""}">`;
      } else {
        const stored = f.kind === "password" && payload.secrets?.[f.key];
        input = `<input type="${f.kind === "password" ? "password" : "text"}"
          data-key="${esc(f.key)}" value="${esc(value ?? "")}" autocomplete="off"
          placeholder="${stored ? esc(L.secretSet) : ""}">`;
      }
      const cls = f.kind === "bool" ? "field switch" : "field";
      return `<div class="${cls}"><label>${label}</label>${input}</div>`;
    }).join("");
    return `<h2>${esc(L.groups[group] || group)}</h2><div class="panel"><div class="grid">${rows}</div></div>`;
  }).join("");
}

async function loadOptions() {
  try {
    const res = await fetch("api/settings", { cache: "no-store" });
    if (res.ok) renderOptions(await res.json());
  } catch (err) { /* settings stay as they were */ }
}

// The carriers we can ask automatically, and so can offer to test.
const TESTABLE = [["dhl", "DHL"], ["hermes", "Hermes"], ["ups", "UPS"], ["fedex", "FedEx"]];

function applyLabels(data) {
  $("hParcels").textContent = L.parcels;
  $("hDelivered").textContent = L.delivered;
  $("hArchive").textContent = L.archive;
  $("hAdd").textContent = L.add;
  $("addHint").textContent = L.addHint;
  $("hOptions").textContent = L.options;
  $("saveSettings").textContent = L.save;
  $("carrierTests").innerHTML = TESTABLE.map(([key, name]) =>
    `<button data-carrier="${key}" data-name="${name}">${esc(L.testCarrier.replace("{c}", name))}</button>`
  ).join(" ");
  $("resetSettings").textContent = L.reset;
  $("hStatus").textContent = L.status;
  $("hSelectors").textContent = L.selectors;
  $("hActions").textContent = L.actions;
  $("settingsHint").textContent = L.settingsHint;
  $("poll").textContent = L.poll;
  $("browserLink").textContent = L.browser;
  $("addBtn").textContent = L.addBtn;
  document.querySelector('label[for="code"]').textContent = L.code;
  document.querySelector('label[for="carrier"]').textContent = L.carrier;
  document.querySelector('label[for="title"]').textContent = L.title;
  document.querySelector('label[for="recipient"]').textContent = L.recipient;
  $("knownPeople").innerHTML = (data.recipients || [])
    .map((r) => `<option value="${esc(r.display)}">`).join("");
  if (!carriersLoaded && data.carriers?.length) {
    $("carrier").innerHTML = data.carriers
      .map((c) => `<option value="${esc(c.key)}">${esc(c.name)}${c.automatic ? " ✓" : ""}</option>`).join("");
    carriersLoaded = true;
  }
}

function show(next) {
  page = next;
  document.querySelectorAll("[data-page]").forEach((s) => s.classList.toggle("on", s.dataset.page === page));
  if (latest) renderNav(latest.counts);
  window.scrollTo(0, 0);
}

function renderAll(data) {
  latest = data;
  L = data.language && T[data.language] ? T[data.language]
    : T[(navigator.language || "de").slice(0, 2).toLowerCase()] || T.de;
  document.documentElement.lang = L === T.en ? "en" : "de";
  applyLabels(data);
  renderNav(data.counts);
  renderParcels(data);
  renderArchive(data);
  renderSettings(data);
}

async function refresh() {
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    renderAll(await res.json());
  } catch (err) { /* keep the last picture */ }
}

document.addEventListener("click", async (event) => {
  const nav = event.target.closest?.("[data-nav]");
  if (nav) { event.preventDefault(); editing = null; show(nav.dataset.nav); return; }

  const filter = event.target.closest?.("[data-filter]");
  if (filter) {
    const key = filter.dataset.filter;
    const hidden = new Set(latest?.hidden_recipients || []);
    hidden.has(key) ? hidden.delete(key) : hidden.add(key);
    await fetch("api/settings", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ hidden_recipients: [...hidden] }) });
    refresh();
    return;
  }

  const edit = event.target.dataset?.edit;
  if (edit) { editing = edit; renderParcels(latest); return; }
  if (event.target.dataset?.cancel) { editing = null; renderParcels(latest); return; }

  const save = event.target.dataset?.save;
  if (save) {
    await fetch(`api/shipments/${encodeURIComponent(save)}`, {
      method: "PATCH", headers: { "content-type": "application/json" },
      body: JSON.stringify({ title: $("editTitle").value, recipient: $("editRecipient").value }),
    });
    editing = null; refresh(); return;
  }

  const restore = event.target.dataset?.restore;
  if (restore) {
    await fetch(`api/shipments/${encodeURIComponent(restore)}/restore`, { method: "POST" });
    refresh();
    return;
  }

  const remove = event.target.dataset?.remove;
  if (remove) {
    if (!confirm(L.removeConfirm)) return;
    await fetch(`api/shipments/${encodeURIComponent(remove)}`, { method: "DELETE" });
    refresh();
  }
});

$("saveSettings").addEventListener("click", async (event) => {
  const b = event.currentTarget, msg = $("saveMsg");
  b.disabled = true; b.textContent = L.saving; msg.textContent = "";
  const payload = {};
  for (const node of document.querySelectorAll("#options [data-key]")) {
    const field = settingsCache.schema.find((f) => f.key === node.dataset.key);
    payload[node.dataset.key] = field.kind === "bool" ? node.checked
      : field.kind === "int" ? Number(node.value) : node.value;
  }
  try {
    const res = await fetch("api/settings", { method: "POST",
      headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(res.status);
    msg.textContent = L.saved;
    await loadOptions(); refresh();
  } catch (err) { msg.textContent = L.errGeneric; }
  finally { b.disabled = false; b.textContent = L.save; }
});

$("carrierTests").addEventListener("click", async (event) => {
  const b = event.target.closest("button[data-carrier]");
  if (!b) return;
  const key = b.dataset.carrier, name = b.dataset.name, msg = $("saveMsg");
  const label = b.textContent;
  b.disabled = true; b.textContent = L.testing; msg.textContent = "";
  try {
    const res = await fetch(`api/test/${key}`, { method: "POST" });
    const data = await res.json();
    const text = data.ok ? L.carrierOk
      : data.reason === "no_key" ? L.carrierNoKey : L.carrierFail + data.reason;
    msg.textContent = text.replace("{c}", name);
  } catch (err) { msg.textContent = L.errGeneric; }
  finally { b.disabled = false; b.textContent = label; }
});

$("resetSettings").addEventListener("click", async () => {
  if (!confirm(L.resetConfirm)) return;
  await fetch("api/settings/reset", { method: "POST" });
  await loadOptions(); refresh();
});

$("poll").addEventListener("click", async (event) => {
  const b = event.currentTarget;
  b.disabled = true; b.textContent = L.polling;
  try { await fetch("api/poll", { method: "POST" }); }
  finally { setTimeout(() => { b.disabled = false; b.textContent = L.poll; refresh(); }, 4000); }
});

$("addBtn").addEventListener("click", async (event) => {
  const b = event.currentTarget, msg = $("addMsg");
  const code = $("code").value.trim();
  msg.textContent = "";
  if (!code) { msg.textContent = L.errCode; return; }
  b.disabled = true; b.textContent = L.adding;
  try {
    const res = await fetch("api/shipments", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ tracking_code: code, carrier: $("carrier").value,
        title: $("title").value.trim(), recipient: $("recipient").value.trim() }),
    });
    if (!res.ok) throw new Error(res.status);
    ["code", "title", "recipient"].forEach((id) => { $(id).value = ""; });
    await refresh(); show("parcels");
  } catch (err) { msg.textContent = L.errGeneric; }
  finally { b.disabled = false; b.textContent = L.addBtn; }
});

refresh();
loadOptions();
setInterval(refresh, 15000);
</script>
</body>
</html>
