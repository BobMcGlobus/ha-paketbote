configuration:
  amazon_domain:
    name: Amazon-Domain
    description: Bestimmt Bestellübersicht und Tracking-Seiten, z. B. amazon.de.
  display_width:
    name: Bildschirmbreite
    description: Auflösung des virtuellen Bildschirms. Kleiner ist auf dem Handy flüssiger.
  display_height:
    name: Bildschirmhöhe
    description: Auflösung des virtuellen Bildschirms.
  llm_provider:
    name: LLM-Anbieter
    description: Nur für den Fallback, wenn die CSS-Selektoren nicht mehr greifen.
  llm_model:
    name: LLM-Modell
    description: Freies Textfeld, damit ein Modellwechsel keinen Neubau braucht.
  llm_api_key:
    name: LLM-API-Schlüssel
    description: Optional. Ohne Schlüssel läuft alles weiter, nur ohne Fallback.
  dhl_api_key:
    name: DHL-API-Schlüssel
    description: Optional. Von developer.dhl.com, Shipment Tracking — Unified. Schaltet
      die DHL-Abfrage frei.
  ups_client_id:
    name: UPS-Client-ID
    description: Optional. Aus einer App auf developer.ups.com mit dem Produkt Tracking.
  ups_client_secret:
    name: UPS-Client-Secret
    description: Gehört zur Client-ID; beide zusammen schalten die UPS-Abfrage frei.
  fedex_client_id:
    name: FedEx-API-Key
    description: Optional. Aus einem Projekt auf developer.fedex.com mit der Track API.
  fedex_client_secret:
    name: FedEx-Secret-Key
    description: Gehört zum API-Key; beide zusammen schalten die FedEx-Abfrage frei.
  hermes_poll_minutes:
    name: 'Hermes: frühestens erneut fragen'
    description: Hermes wird immer von der eigenen Sendungsverfolgung gelesen; es
      gibt dort keinen Schlüssel zu beantragen.
  web_fallback:
    name: Von der Zustellerseite lesen
    description: Wenn kein API-Schlüssel hinterlegt ist — oder er abgelehnt wird —
      wird der Status von der öffentlichen Sendungsverfolgung des Zustellers geholt.
  imap_host:
    name: IMAP-Server
    description: Postfach, in das die Versandbestätigungen laufen. Damit werden alle
      Shops erfasst, nicht nur Amazon. Wird nur gelesen, nie verändert.
  imap_port:
    name: IMAP-Port
    description: 993 mit SSL, 143 ohne.
  imap_user:
    name: IMAP-Benutzer
    description: Meist die vollständige Mailadresse.
  imap_password:
    name: IMAP-Passwort
    description: Wenn möglich ein App-Passwort statt des Kontopassworts.
  imap_folder:
    name: IMAP-Ordner
    description: Standard INBOX. Praktisch ist ein eigener Ordner, in den eine
      Filterregel nur Versandmails einsortiert.
  imap_ssl:
    name: SSL/TLS
    description: Sollte an bleiben.
  imap_poll_minutes:
    name: Postfach prüfen alle
    description: Kostet keinen Amazon-Abruf und läuft unabhängig vom Tageslimit.
  keep_delivered_hours:
    name: Zugestellte bleiben sichtbar
    description: Wie lange ein zugestelltes Paket auf der Hauptseite bleibt, bevor
      es ins Archiv wandert. Zum selben Zeitpunkt verschwindet es aus Home Assistant.
  poll_idle_minutes:
    name: 'Intervall: untätig'
    description: Abstand, wenn keine Sendung aktiv ist.
  poll_pending_minutes:
    name: 'Intervall: heute erwartet'
    description: Abstand, wenn heute zugestellt wird, das Fenster aber noch zu ist.
  poll_window_minutes:
    name: 'Intervall: Zustellfenster'
    description: Abstand, während das Zustellfenster offen ist.
  poll_approaching_minutes:
    name: 'Intervall: kommt näher'
    description: Abstand, sobald weniger Stopps als die Schwelle übrig sind.
  poll_imminent_minutes:
    name: 'Intervall: gleich da'
    description: Abstand kurz vor der Zustellung.
  approaching_stops_threshold:
    name: 'Schwelle: kommt näher'
    description: Ab so vielen verbleibenden Stopps wird enger abgefragt.
  imminent_stops_threshold:
    name: 'Schwelle: gleich da'
    description: Ab so vielen verbleibenden Stopps wird im Minutentakt abgefragt.
  quiet_hours_start:
    name: Nachtruhe ab
    description: Ab dieser Stunde gilt immer das untätige Intervall.
  quiet_hours_end:
    name: Nachtruhe bis
    description: Bis zu dieser Stunde gilt immer das untätige Intervall.
  daily_request_cap:
    name: Tageslimit
    description: Harter Stopp bis Mitternacht, wenn so viele Abrufe erreicht sind.
  jitter_percent:
    name: Streuung
    description: Zufällige Abweichung auf jedes Intervall, gegen auffällige Regelmäßigkeit.
  dump_on_start:
    name: Beim Start ausgeben
    description: Schreibt einmalig alle Seiten nach /config/dumps. Enthält die Lieferadresse.
  developer_mode:
    name: Entwicklermodus
    description: Trefferquote je Feld als Attribute, plus Ablage nicht lesbarer Seiten.
  language:
    name: Sprache
    description: Sprache der Oberfläche. „auto“ folgt dem Browser.
  log_level:
    name: Protokollstufe
    description: „debug“ zeigt jeden Schritt.
