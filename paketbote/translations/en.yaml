configuration:
  amazon_domain:
    name: Amazon domain
    description: Decides the order list and tracking pages, e.g. amazon.de.
  display_width:
    name: Screen width
    description: Resolution of the virtual screen. Smaller is smoother on a phone.
  display_height:
    name: Screen height
    description: Resolution of the virtual screen.
  llm_provider:
    name: LLM provider
    description: Only used as a fallback when the CSS selectors stop matching.
  llm_model:
    name: LLM model
    description: Free text, so switching models needs no rebuild.
  llm_api_key:
    name: LLM API key
    description: Optional. Without a key everything keeps working, just without the
      fallback.
  dhl_api_key:
    name: DHL API key
    description: Optional. From developer.dhl.com, Shipment Tracking — Unified. Enables
      DHL lookups.
  ups_client_id:
    name: UPS client ID
    description: Optional. From an app on developer.ups.com with the Tracking product.
  ups_client_secret:
    name: UPS client secret
    description: Goes with the client ID; together they enable UPS lookups.
  fedex_client_id:
    name: FedEx API key
    description: Optional. From a project on developer.fedex.com with the Track API.
  fedex_client_secret:
    name: FedEx secret key
    description: Goes with the API key; together they enable FedEx lookups.
  hermes_poll_minutes:
    name: 'Hermes: ask again no sooner than'
    description: Hermes is always read from their own tracking page; there is no key
      to apply for.
  web_fallback:
    name: Read from the carrier's own site
    description: When no API key is configured — or it is refused — the status is
      read from the carrier's public tracking page.
  imap_host:
    name: IMAP server
    description: The mailbox shipping notices arrive in. This covers every shop,
      not just Amazon. Read only, never modified.
  imap_port:
    name: IMAP port
    description: 993 with SSL, 143 without.
  imap_user:
    name: IMAP user
    description: Usually the full mail address.
  imap_password:
    name: IMAP password
    description: An app password rather than the account password where possible.
  imap_folder:
    name: IMAP folder
    description: INBOX by default. A folder a filter rule feeds with shipping mail
      only works well.
  imap_ssl:
    name: SSL/TLS
    description: Best left on.
  imap_poll_minutes:
    name: Check the mailbox every
    description: Costs no Amazon request and runs independently of the daily cap.
  poll_idle_minutes:
    name: 'Interval: idle'
    description: Gap while nothing is in transit.
  poll_pending_minutes:
    name: 'Interval: due today'
    description: Gap while delivery is due today but the window is not open.
  poll_window_minutes:
    name: 'Interval: delivery window'
    description: Gap while the delivery window is open.
  poll_approaching_minutes:
    name: 'Interval: getting close'
    description: Gap once fewer stops remain than the threshold.
  poll_imminent_minutes:
    name: 'Interval: almost there'
    description: Gap shortly before delivery.
  approaching_stops_threshold:
    name: 'Threshold: getting close'
    description: Poll more often below this many remaining stops.
  imminent_stops_threshold:
    name: 'Threshold: almost there'
    description: Poll every minute below this many remaining stops.
  quiet_hours_start:
    name: Quiet hours from
    description: From this hour the idle interval always applies.
  quiet_hours_end:
    name: Quiet hours until
    description: Until this hour the idle interval always applies.
  daily_request_cap:
    name: Daily cap
    description: Hard stop until midnight once this many requests are spent.
  jitter_percent:
    name: Jitter
    description: Random spread on every interval, against conspicuous regularity.
  dump_on_start:
    name: Dump on start
    description: Writes every page to /config/dumps once. Contains your delivery address.
  developer_mode:
    name: Developer mode
    description: Per-field hit rate as attributes, plus copies of unreadable pages.
  language:
    name: Language
    description: Interface language. "auto" follows the browser.
  log_level:
    name: Log level
    description: '"debug" shows every step.'
