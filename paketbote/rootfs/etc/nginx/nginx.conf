worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/1 warn;
daemon off;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;

    # Ingress rewrites Location headers itself; absolute redirects break it.
    absolute_redirect off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 6080 default_server;
        server_name _;

        # Only the Supervisor's ingress proxy may reach this port. Everything
        # else — including other containers on the host — is refused.
        allow 172.30.32.2;
        deny all;

        # The interface. Everything not claimed below belongs to it.
        location / {
            proxy_pass http://127.0.0.1:8099;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /browser {
            return 302 "$http_x_ingress_path/browser/";
        }

        # The browser panel. The trailing slash on proxy_pass strips the
        # prefix, so noVNC's relative assets resolve back through here.
        location /browser/ {
            proxy_pass http://127.0.0.1:6081/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;

            # The session sits open and idle for long stretches; the default
            # 60s read timeout would tear the panel down every minute.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
