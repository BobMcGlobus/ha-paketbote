worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/1 warn;
daemon off;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;

    # Ingress rewrites Location headers itself; absolute redirects break it.
    absolute_redirect off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 6080 default_server;
        server_name _;

        # Only the Supervisor's ingress proxy may reach this port. Everything
        # else — including other containers on the host — is refused.
        allow 172.30.32.2;
        deny all;

        # The web client is served straight from disk.
        #
        # KasmVNC's own HTTP server always demands basic auth: -DisableBasicAuth
        # only covers websocket connections, which is why proxying the client
        # through it answered 401 no matter what credential we supplied. This is
        # also how the reference containers do it.
        location = / {
            # Name the websocket path explicitly rather than relying on the
            # client's default, and connect without a click.
            return 302 "$http_x_ingress_path/index.html?path=websockify&autoconnect=true&resize=remote";
        }

        location / {
            root /usr/share/kasmvnc/www;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # The actual VNC stream. -DisableBasicAuth applies here, so it goes to
        # KasmVNC directly.
        location /websockify {
            proxy_pass http://127.0.0.1:6081/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;

            # The session sits open and idle for long stretches; the default
            # 60s read timeout would tear the panel down every minute.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Optional client endpoints (stats, clipboard). These do go through
        # KasmVNC's basic auth, so present the generated credential. If it is
        # not accepted only these extras degrade, not the session itself.
        location /api/ {
            include /etc/nginx/conf.d/kasm-auth.conf;

            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
